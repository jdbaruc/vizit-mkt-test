<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Scoring · Vizit</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  :root {
    /* semantic score colors — tuned to match the reference */
    --score-high:     #6BBE2C;
    --score-high-soft:#C5E89A;
    --score-med:      #E8B225;
    --score-med-soft: #F4DB87;
    --score-low:      #E25A4D;
    --score-low-soft: #F2A89E;
    --track:          #ECECEC;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; }

  /* ─── app chrome ─────────────────────────────────────── */
  .app {
    max-width: 1320px;
    margin: 0 auto;
    padding: var(--space-7) var(--space-7) var(--space-9);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
    padding-bottom: var(--space-5);
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand {
    display: flex; align-items: center; gap: var(--space-3);
  }
  .topbar .brand img { height: 18px; display: block; }
  .topbar .brand .divider {
    width: 1px; height: 18px; background: var(--border);
  }
  .topbar .brand .crumb {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .topbar .actions { display: flex; gap: var(--space-2); align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 16px;
    border-radius: var(--radius-full);
    font-size: var(--text-sm); font-weight: 500;
    cursor: pointer; transition: all var(--duration) var(--ease);
    border: 1px solid transparent;
  }
  .btn-secondary { background: white; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: var(--color-400); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--blue-500); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--text); background: var(--surface); }

  /* ─── product header ─────────────────────────────────── */
  .product-header {
    margin: var(--space-5) 0 var(--space-4);
    max-width: 980px;
  }
  .ph-eyebrow {
    display: flex; align-items: center; gap: var(--space-3);
    font-family: var(--font-mono); font-size: var(--text-xs);
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: var(--space-3);
    flex-wrap: wrap;
  }
  .ph-eyebrow .cat { color: var(--text); }
  .ph-eyebrow .dot {
    width: 3px; height: 3px; background: var(--color-300);
    border-radius: 50%; flex-shrink: 0;
  }
  .ph-title {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    line-height: 1.2;
    letter-spacing: -0.015em;
    font-weight: 400;
    margin: 0;
    text-wrap: pretty;
    color: var(--text);
  }

  /* ─── filter/sort row ─────────────────────────────────── */
  .filter-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-3) 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: var(--space-5);
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    padding: 3px;
    background: white;
  }
  .seg button {
    border: none; background: transparent;
    padding: 6px 14px;
    font-family: var(--font-mono); font-size: var(--text-xs);
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted);
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all var(--duration) var(--ease);
  }
  .seg button.active { background: var(--text); color: white; }
  .seg button:hover:not(.active) { color: var(--text); }

  .sort {
    display: inline-flex; align-items: center; gap: var(--space-3);
    font-family: var(--font-mono); font-size: var(--text-xs);
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted);
  }
  .sort select {
    font: inherit; font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text); background: transparent;
    border: none; cursor: pointer;
    padding: 4px 0;
  }

  /* ─── product tabs (12 ASINs) ──────────────────────────── */
  .product-tabs {
    margin: var(--space-5) 0 0;
    border-bottom: 1px solid var(--border);
  }
  .product-tabs-scroll {
    display: flex;
    overflow-x: auto;
    scrollbar-width: thin;
    gap: 0;
  }
  .product-tabs-scroll::-webkit-scrollbar { height: 4px; }
  .product-tabs-scroll::-webkit-scrollbar-thumb { background: var(--color-300); border-radius: 2px; }
  .ptab {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    background: transparent; border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all var(--duration) var(--ease);
    min-width: 0;
    position: relative;
    margin-bottom: -1px; /* overlap container border for active state */
  }
  .ptab + .ptab { border-left: 1px solid var(--border); }
  .ptab-asin {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text);
    white-space: nowrap;
  }
  .ptab-name {
    font-family: var(--font-sans);
    font-size: var(--text-xs);
    color: var(--muted);
    white-space: nowrap;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ptab-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    padding: 1px 7px;
    min-width: 22px;
    text-align: center;
  }
  .ptab-count.empty {
    color: var(--color-400);
    background: transparent;
  }
  .ptab:hover:not(.active) { background: var(--surface); }
  .ptab:hover:not(.active) .ptab-name { color: var(--text); }
  .ptab.active {
    border-bottom-color: var(--text);
  }
  .ptab.active .ptab-asin { color: var(--text); }
  .ptab.active .ptab-name { color: var(--text); }
  .ptab.active .ptab-count {
    background: var(--text); color: white; border-color: var(--text);
  }

  /* ─── list ─────────────────────────────────────────────── */
  .list { display: flex; flex-direction: column; gap: var(--space-3); }

  .row {
    display: grid;
    grid-template-columns: 128px minmax(0, 1fr) 168px;
    gap: var(--space-5);
    align-items: stretch;
    padding: var(--space-4) var(--space-5);
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    transition: border-color var(--duration) var(--ease),
                box-shadow var(--duration) var(--ease);
    min-height: 0;
  }
  .row:hover { border-color: var(--color-300); box-shadow: var(--shadow-sm); }

  /* image column — image fills the cell, no padding/border */
  .row .img-cell {
    display: flex;
    align-self: stretch;
    margin: calc(var(--space-4) * -1) 0 calc(var(--space-4) * -1) calc(var(--space-5) * -1);
  }
  .row .product-img {
    width: 100%;
    border-radius: 0;
    background: var(--surface);
    overflow: hidden;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    border-top-left-radius: var(--radius-lg);
    border-bottom-left-radius: var(--radius-lg);
  }
  .row .product-img > img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  /* center column — title + mini bars */
  .row .body-cell {
    display: flex; flex-direction: column; gap: 12px;
    min-width: 0;
  }
  .row .title-line {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--space-4);
  }
  .row .filename {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.005em;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: var(--radius-sm);
  }
  .row .title-note {
    font-family: var(--font-sans);
    font-size: var(--text-xs);
    color: var(--muted);
    font-weight: 400;
    letter-spacing: -0.005em;
    flex: 1;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .it-badge {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: var(--radius-full);
    background: white;
    border: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .it-badge.live  { background: var(--text); color: white; border-color: var(--text); }
  .it-badge.rec   { background: var(--accent); color: white; border-color: var(--accent); }
  .it-badge.test  { background: white; color: var(--text); }
  .it-badge.exp   { background: var(--surface); color: var(--muted); }

  /* horizontal mini-bar grid for Mobile-Readiness */
  .mr-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: var(--space-4);
  }
  .mr-cell {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .mr-cell-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mr-cell-value {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .mr-cell-value.high { color: #2E8A1F; }
  .mr-cell-value.med  { color: #C88A0E; }
  .mr-cell-value.low  { color: #C73B2E; }
  .mr-cell.pending .mr-cell-value { color: var(--color-400); }

  .bar-track {
    position: relative;
    height: 6px;
    background: var(--track);
    border-radius: var(--radius-full);
    overflow: hidden;
  }
  .bar-fill {
    position: absolute; inset: 0;
    border-radius: var(--radius-full);
    transform-origin: left center;
    transition: width 600ms var(--ease);
  }
  .bar-fill.high {
    background: linear-gradient(to right,
      color-mix(in oklab, var(--score-high) 50%, white) 0%,
      var(--score-high) 100%);
  }
  .bar-fill.med {
    background: linear-gradient(to right,
      color-mix(in oklab, var(--score-med) 55%, white) 0%,
      var(--score-med) 100%);
  }
  .bar-fill.low {
    background: linear-gradient(to right,
      color-mix(in oklab, var(--score-low) 45%, white) 0%,
      var(--score-low) 100%);
  }
  .bar-fill.pending {
    background: repeating-linear-gradient(
      135deg,
      var(--color-200) 0 6px,
      var(--color-100) 6px 12px);
    width: 100%;
    opacity: 0.6;
  }

  /* right column — Visual Score */
  .scores-cell {
    display: flex; flex-direction: column;
    gap: var(--space-3);
    align-items: flex-start;
    border-left: 1px solid var(--border);
    padding-left: var(--space-5);
  }

  .hero-score { display: flex; flex-direction: column; gap: 4px; }
  .hero-score .hs-name {
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
  }
  .hero-score .hs-line {
    display: flex; align-items: center; gap: var(--space-2);
  }
  .hs-number {
    font-family: var(--font-display);
    font-size: 2rem;
    line-height: 1;
    letter-spacing: -0.03em;
    font-weight: 400;
  }
  .hs-number.pill-low  { color: var(--score-low); }
  .hs-number.pill-mod  { color: #C88A0E; }
  .hs-number.pill-high { color: #2E8A1F; }
  .hs-pill {
    display: inline-flex; align-items: center;
    padding: 3px 8px;
    border-radius: var(--radius-full);
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
    border: 1px solid;
  }
  .hs-pill.pill-low {
    background: color-mix(in oklab, var(--score-low) 14%, white);
    border-color: color-mix(in oklab, var(--score-low) 35%, white);
    color: #B23B2E;
  }
  .hs-pill.pill-mod {
    background: color-mix(in oklab, var(--score-med) 18%, white);
    border-color: color-mix(in oklab, var(--score-med) 45%, white);
    color: #B8800A;
  }
  .hs-pill.pill-high {
    background: color-mix(in oklab, var(--score-high) 14%, white);
    border-color: color-mix(in oklab, var(--score-high) 38%, white);
    color: #2E8A1F;
  }
  .hs-number.pill-pending { color: var(--color-400); }
  .hs-pill.pill-pending {
    background: var(--surface);
    border-color: var(--border);
    color: var(--muted);
  }

  .row-open {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
    cursor: pointer;
    border: none; background: transparent;
    padding: 0;
  }
  .row-open:hover { color: var(--accent); }
  .row-open svg { transition: transform var(--duration) var(--ease); }
  .row-open:hover svg { transform: translateX(2px); }

  /* ─── empty state ──────────────────────────────────────── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    padding: var(--space-9) var(--space-6);
    background: white;
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
  }
  .empty-asin {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding: 4px 10px;
    background: var(--surface);
    border-radius: var(--radius-full);
  }
  .empty-title {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    line-height: 1.2;
    letter-spacing: -0.015em;
    color: var(--text);
    margin-top: 4px;
  }
  .empty-copy {
    font-size: var(--text-sm);
    color: var(--muted);
    max-width: 380px;
    line-height: 1.5;
  }
  .empty-actions {
    display: flex; gap: var(--space-2);
    margin-top: var(--space-3);
  }

  /* footer */
  .foot {
    margin-top: var(--space-7);
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: var(--text-xs);
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
  }

  /* compact mode */
  body.compact .row { padding: var(--space-3) var(--space-4); gap: var(--space-4); grid-template-columns: 96px minmax(0, 1fr) 148px; }
  body.compact .row .img-cell { margin: calc(var(--space-3) * -1) 0 calc(var(--space-3) * -1) calc(var(--space-4) * -1); }
  body.compact .bar-track { height: 5px; }
  body.compact .hs-number { font-size: 1.6rem; }

  /* responsive */
  @media (max-width: 1100px) {
    .row { grid-template-columns: 112px minmax(0, 1fr) 148px; gap: var(--space-4); }
    .row .img-cell { margin-left: calc(var(--space-4) * -1); }
    .mr-grid { gap: var(--space-3); }
  }
  @media (max-width: 860px) {
    .row { grid-template-columns: 96px 1fr; }
    .scores-cell {
      grid-column: 1 / -1;
      border-left: none; padding-left: 0;
      border-top: 1px solid var(--border); padding-top: var(--space-3);
      flex-direction: row; align-items: center; justify-content: space-between;
    }
    .mr-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .mr-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
